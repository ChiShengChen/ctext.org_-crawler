<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Helvetica Neue', Arial, 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- transparent background -->

  <!-- title -->
  <text x="70" y="70" font-size="36" font-weight="700" fill="#0f172a">Digital Humanities Methods</text>
  <text x="70" y="103" font-size="19" fill="#64748b">Distant reading × close reading — quantitative signals verified in the texts</text>
  <line x1="70" y1="122" x2="1210" y2="122" stroke="#e2e8f0" stroke-width="2"/>

  <!-- input chip -->
  <rect x="415" y="140" width="450" height="40" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="640" y="165" font-size="15" fill="#334155" text-anchor="middle">Input: 523 poems · 3 subcorpora（G1 · G1m · G2）</text>

  <!-- branch lines -->
  <line x1="640" y1="180" x2="640" y2="202" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="201" y1="202" x2="1077" y2="202" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="201" y1="202" x2="201" y2="226" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="493" y1="202" x2="493" y2="226" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="785" y1="202" x2="785" y2="226" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1077" y1="202" x2="1077" y2="226" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===================== CARD 1: LEXICAL ANALYSIS ===================== -->
  <g>
    <rect x="70" y="232" width="262" height="316" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="70" y="232" width="262" height="60" rx="14" fill="#2563eb"/>
    <rect x="70" y="272" width="262" height="20" fill="#2563eb"/>
    <text x="90" y="256" font-size="13" font-weight="600" fill="#bfdbfe" letter-spacing="2">QUANTITATIVE</text>
    <text x="90" y="280" font-size="20" font-weight="700" fill="#ffffff">Lexical Analysis</text>

    <g font-size="15.5" fill="#1e293b">
      <circle cx="94" cy="320" r="3" fill="#2563eb"/>
      <text x="108" y="326">1–2 gram char tokens</text>
      <text x="108" y="346" font-size="13.5" fill="#475569">no segmentation needed</text>

      <circle cx="94" cy="376" r="3" fill="#2563eb"/>
      <text x="108" y="382">Weighted log-odds</text>
      <text x="108" y="402" font-size="13.5" fill="#475569">informative Dirichlet prior</text>
      <text x="108" y="420" font-size="13.5" fill="#475569">(Monroe et al. 2008)</text>

      <circle cx="94" cy="450" r="3" fill="#2563eb"/>
      <text x="108" y="456">Prior = full corpus</text>
      <text x="108" y="476" font-size="13.5" fill="#475569">Quan Tangshi, ~41,882 poems</text>

      <circle cx="94" cy="506" r="3" fill="#2563eb"/>
      <text x="108" y="512">Ranked by z-score</text>
      <text x="108" y="532" font-size="13.5" fill="#475569">robust at low frequency</text>
    </g>
  </g>

  <!-- ===================== CARD 2: IMAGERY ANALYSIS ===================== -->
  <g>
    <rect x="362" y="232" width="262" height="316" rx="14" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
    <rect x="362" y="232" width="262" height="60" rx="14" fill="#0d9488"/>
    <rect x="362" y="272" width="262" height="20" fill="#0d9488"/>
    <text x="382" y="256" font-size="13" font-weight="600" fill="#99f6e4" letter-spacing="2">INTERPRETABLE</text>
    <text x="382" y="280" font-size="20" font-weight="700" fill="#ffffff">Imagery Analysis</text>

    <g font-size="15.5" fill="#1e293b">
      <circle cx="386" cy="320" r="3" fill="#0d9488"/>
      <text x="400" y="326">5 lexical fields 語彙場</text>
      <text x="400" y="345" font-size="13" fill="#475569">hand-curated closed char sets</text>

      <g font-size="11.5" fill="#475569">
        <text x="386" y="368"><tspan font-weight="700" fill="#0f766e">怨情</tspan> 怨愁恨悲淚泣啼寂寞孤斷腸憂哀</text>
        <text x="386" y="387"><tspan font-weight="700" fill="#0f766e">時序</tspan> 秋春夜月風霜寒曉暮昏更漏年</text>
        <text x="386" y="406"><tspan font-weight="700" fill="#0f766e">宮殿</tspan> 宮殿樓臺闕簾幕階砌苔井戶窗庭牆</text>
        <text x="386" y="425"><tspan font-weight="700" fill="#0f766e">服飾</tspan> 羅綺紈扇鏡妝黛粉釵鈿衣裳金玉</text>
        <text x="386" y="444"><tspan font-weight="700" fill="#0f766e">君恩</tspan> 君恩寵幸顧承歡愛專新舊棄</text>
      </g>

      <circle cx="386" cy="466" r="3" fill="#0d9488"/>
      <text x="400" y="472">Normalized frequency</text>
      <text x="400" y="491" font-size="13" fill="#475569">char hits per 10,000 chars 每萬字</text>

      <circle cx="386" cy="514" r="3" fill="#0d9488"/>
      <text x="400" y="520">Focused contrast</text>
      <text x="400" y="538" font-size="13" fill="#475569">代言 G1m vs 女詩人 G2</text>
    </g>
  </g>

  <!-- ===================== CARD 3: STRUCTURAL & REGISTER ===================== -->
  <g>
    <rect x="654" y="232" width="262" height="316" rx="14" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
    <rect x="654" y="232" width="262" height="60" rx="14" fill="#7c3aed"/>
    <rect x="654" y="272" width="262" height="20" fill="#7c3aed"/>
    <text x="674" y="256" font-size="13" font-weight="600" fill="#ddd6fe" letter-spacing="2">STRUCTURAL</text>
    <text x="674" y="280" font-size="20" font-weight="700" fill="#ffffff">Structure &amp; Register</text>

    <g font-size="15.5" fill="#1e293b">
      <circle cx="678" cy="320" r="3" fill="#7c3aed"/>
      <text x="692" y="326">Poem form 詩形</text>
      <text x="692" y="346" font-size="13.5" fill="#475569">5-char · 7-char · mixed lines</text>

      <circle cx="678" cy="376" r="3" fill="#7c3aed"/>
      <text x="692" y="382">Question rate 問句率</text>
      <text x="692" y="402" font-size="13.5" fill="#475569">interrogatives per 100 lines</text>

      <circle cx="678" cy="432" r="3" fill="#7c3aed"/>
      <text x="692" y="438">Function words 虛詞</text>
      <text x="692" y="458" font-size="13.5" fill="#475569">person 人稱 · modal 語氣</text>
      <text x="692" y="476" font-size="13.5" fill="#475569">temporal 時間 · negation 否定</text>

      <circle cx="678" cy="506" r="3" fill="#7c3aed"/>
      <text x="692" y="512">Register markers</text>
      <text x="692" y="532" font-size="13.5" fill="#475569">reduplication 疊字 · 君 / 妾</text>
    </g>
  </g>

  <!-- ===================== CARD 4: CLOSE READING ===================== -->
  <g>
    <rect x="946" y="232" width="262" height="316" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
    <rect x="946" y="232" width="262" height="60" rx="14" fill="#d97706"/>
    <rect x="946" y="272" width="262" height="20" fill="#d97706"/>
    <text x="966" y="256" font-size="13" font-weight="600" fill="#fde68a" letter-spacing="2">QUALITATIVE</text>
    <text x="966" y="280" font-size="20" font-weight="700" fill="#ffffff">Close Reading</text>

    <g font-size="15.5" fill="#1e293b">
      <circle cx="970" cy="320" r="3" fill="#d97706"/>
      <text x="984" y="326">Per-poem originals</text>
      <text x="984" y="346" font-size="13.5" fill="#475569">punctuated texts, by group</text>

      <circle cx="970" cy="376" r="3" fill="#d97706"/>
      <text x="984" y="382">Terms read in context</text>

      <circle cx="970" cy="414" r="3" fill="#d97706"/>
      <text x="984" y="420">Allusions &amp; exempla</text>
      <text x="984" y="440" font-size="13.5" fill="#475569">Changmen 長門 · fan 團扇</text>
      <text x="984" y="458" font-size="13.5" fill="#475569">Ban Jieyu 班婕妤 …</text>

      <circle cx="970" cy="488" r="3" fill="#d97706"/>
      <text x="984" y="494">Caveat auditing</text>
      <text x="984" y="514" font-size="13.5" fill="#475569">small n · one-author skew</text>
      <text x="984" y="532" font-size="13.5" fill="#475569">(Lady Huarui 花蕊夫人)</text>
    </g>
  </g>

  <!-- ===================== convergence to findings ===================== -->
  <line x1="201" y1="548" x2="201" y2="572" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="493" y1="548" x2="493" y2="572" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="785" y1="548" x2="785" y2="572" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="1077" y1="548" x2="1077" y2="572" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="201" y1="572" x2="1077" y2="572" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="420" y1="572" x2="420" y2="596" stroke="#475569" stroke-width="2.5" marker-end="url(#arrowDark)"/>

  <!-- findings bar -->
  <rect x="70" y="600" width="700" height="80" rx="14" fill="#1e293b"/>
  <text x="100" y="632" font-size="18" font-weight="700" fill="#ffffff">→ Findings — cross-validated across the four methods</text>
  <text x="100" y="660" font-size="15" fill="#cbd5e1">ventriloquism: allusive court diction · female self-voice: direct, affect-laden diction</text>

  <!-- future work (dashed) -->
  <line x1="770" y1="640" x2="800" y2="640" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <rect x="808" y="600" width="402" height="80" rx="14" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="832" y="628" font-size="13.5" font-weight="600" fill="#64748b" letter-spacing="2">FUTURE WORK</text>
  <text x="832" y="652" font-size="16.5" font-weight="700" fill="#334155">Full syntactic parsing 句法剖析</text>
  <text x="832" y="672" font-size="13.5" fill="#64748b">stylometry 風格計量 · topic models 主題模型</text>
</svg>
