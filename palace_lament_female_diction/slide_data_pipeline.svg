<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Helvetica Neue', Arial, 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- transparent background (no rect) -->

  <!-- title -->
  <text x="70" y="78" font-size="36" font-weight="700" fill="#0f172a">Corpus Construction Pipeline</text>
  <text x="70" y="112" font-size="19" fill="#64748b">Quan Tangshi 全唐詩 (Complete Tang Poems) — from web crawling to labeled subcorpora</text>
  <line x1="70" y1="134" x2="1210" y2="134" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ===================== STAGE 1: DATA CRAWLING ===================== -->
  <g>
    <rect x="70" y="180" width="330" height="330" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="70" y="180" width="330" height="64" rx="14" fill="#2563eb"/>
    <rect x="70" y="222" width="330" height="22" fill="#2563eb"/>
    <text x="92" y="212" font-size="15" font-weight="600" fill="#bfdbfe" letter-spacing="2">STEP 1</text>
    <text x="92" y="234" font-size="22" font-weight="700" fill="#ffffff">Data Crawling</text>

    <g font-size="16.5" fill="#1e293b">
      <circle cx="98" cy="276" r="3" fill="#2563eb"/>
      <text x="112" y="282">Source: <tspan font-weight="600">Chinese Text Project</tspan></text>
      <text x="112" y="304" font-size="14.5" fill="#475569">ctext.org — Quan Tangshi full text</text>

      <circle cx="98" cy="336" r="3" fill="#2563eb"/>
      <text x="112" y="342">Custom Python crawler</text>
      <text x="112" y="364" font-size="14.5" fill="#475569">requests · BeautifulSoup · cloudscraper</text>

      <circle cx="98" cy="396" r="3" fill="#2563eb"/>
      <text x="112" y="402">Rate-limiting · retries · resumable</text>

      <circle cx="98" cy="432" r="3" fill="#2563eb"/>
      <text x="112" y="438"><tspan font-weight="700">900 juan</tspan> 卷 · <tspan font-weight="700">~41,882</tspan> poems</text>
      <text x="112" y="460" font-size="14.5" fill="#475569">stored as per-volume plain text</text>
    </g>

    <!-- output chip -->
    <rect x="100" y="530" width="270" height="40" rx="20" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="235" y="555" font-size="14.5" fill="#1d4ed8" text-anchor="middle">raw volume files (.txt)</text>
    <line x1="235" y1="510" x2="235" y2="528" stroke="#93c5fd" stroke-width="1.5"/>
  </g>

  <!-- arrow 1 -->
  <line x1="404" y1="345" x2="466" y2="345" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ===================== STAGE 2: DATA CLEANING ===================== -->
  <g>
    <rect x="475" y="180" width="330" height="330" rx="14" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
    <rect x="475" y="180" width="330" height="64" rx="14" fill="#0d9488"/>
    <rect x="475" y="222" width="330" height="22" fill="#0d9488"/>
    <text x="497" y="212" font-size="15" font-weight="600" fill="#99f6e4" letter-spacing="2">STEP 2</text>
    <text x="497" y="234" font-size="22" font-weight="700" fill="#ffffff">Data Cleaning</text>

    <g font-size="16.5" fill="#1e293b">
      <circle cx="503" cy="276" r="3" fill="#0d9488"/>
      <text x="517" y="282">Poem-level parsing</text>
      <text x="517" y="304" font-size="14.5" fill="#475569">author · title · body</text>

      <circle cx="503" cy="336" r="3" fill="#0d9488"/>
      <text x="517" y="342">Title normalization</text>
      <text x="517" y="364" font-size="14.5" fill="#475569">yuefu 樂府 prefixes · first-line suffixes</text>
      <text x="517" y="384" font-size="14.5" fill="#475569">variant characters (e.g. 倢伃 ↔ 婕妤)</text>

      <circle cx="503" cy="416" r="3" fill="#0d9488"/>
      <text x="517" y="422">Punctuation stripped for statistics</text>

      <circle cx="503" cy="452" r="3" fill="#0d9488"/>
      <text x="517" y="458">Deduplication · metadata repair</text>
      <text x="517" y="480" font-size="14.5" fill="#475569">misaligned author / gender fields</text>
    </g>

    <!-- output chip -->
    <rect x="505" y="530" width="270" height="40" rx="20" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
    <text x="640" y="555" font-size="14.5" fill="#0f766e" text-anchor="middle">structured corpus</text>
    <line x1="640" y1="510" x2="640" y2="528" stroke="#5eead4" stroke-width="1.5"/>
  </g>

  <!-- arrow 2 -->
  <line x1="809" y1="345" x2="871" y2="345" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ===================== STAGE 3: LABELING ===================== -->
  <g>
    <rect x="880" y="180" width="330" height="330" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
    <rect x="880" y="180" width="330" height="64" rx="14" fill="#d97706"/>
    <rect x="880" y="222" width="330" height="22" fill="#d97706"/>
    <text x="902" y="212" font-size="15" font-weight="600" fill="#fde68a" letter-spacing="2">STEP 3</text>
    <text x="902" y="234" font-size="22" font-weight="700" fill="#ffffff">Labeling</text>

    <g font-size="16" fill="#1e293b">
      <circle cx="908" cy="272" r="3" fill="#d97706"/>
      <text x="922" y="278">Curated palace-lament poem list</text>
      <text x="922" y="299" font-size="14" fill="#475569">gongyuan 宮怨 — author · gender · title</text>

      <circle cx="908" cy="322" r="3" fill="#d97706"/>
      <text x="922" y="328">Matched via normalized titles</text>
      <text x="922" y="349" font-size="14" fill="#475569"><tspan font-weight="700" fill="#b45309">~89%</tspan> hit rate (45 unmatched, logged)</text>

      <circle cx="908" cy="372" r="3" fill="#d97706"/>
      <text x="922" y="378">Supplementary female-poet roster</text>
      <text x="922" y="399" font-size="14" fill="#475569">Xue Tao 薛濤 · Yu Xuanji 魚玄機 · et al.</text>

      <circle cx="908" cy="422" r="3" fill="#d97706"/>
      <text x="922" y="428">Gender cross-checked against CBDB</text>
      <text x="922" y="449" font-size="14" fill="#475569">China Biographical Database</text>

      <circle cx="908" cy="472" r="3" fill="#d97706"/>
      <text x="922" y="478">Subgrouping by title keywords</text>
      <text x="922" y="499" font-size="14" fill="#475569">palace verse vs. boudoir lament (automatic)</text>
    </g>

    <!-- output chip -->
    <rect x="910" y="530" width="270" height="40" rx="20" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>
    <text x="1045" y="555" font-size="14.5" fill="#b45309" text-anchor="middle">G1 / G1m / G2 / G3d / G3l</text>
    <line x1="1045" y1="510" x2="1045" y2="528" stroke="#fcd34d" stroke-width="1.5"/>
  </g>

  <!-- ===================== BOTTOM: subcorpora legend → analysis ===================== -->
  <g>
    <line x1="235" y1="570" x2="235" y2="596" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="640" y1="570" x2="640" y2="596" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="1045" y1="570" x2="1045" y2="596" stroke="#cbd5e1" stroke-width="2"/>

    <rect x="70" y="596" width="1140" height="104" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="95" y="624" font-size="13.5" font-weight="600" fill="#64748b" letter-spacing="2">FIVE SUBCORPORA → ANALYSIS</text>
    <text x="1185" y="624" font-size="13.5" fill="#64748b" text-anchor="end">523 labeled poems in total</text>

    <!-- G1 -->
    <text x="95" y="656" font-size="16" fill="#1e293b"><tspan font-weight="700" fill="#b45309">G1</tspan>  Palace-lament poems</text>
    <text x="95" y="680" font-size="13.5" fill="#64748b">宮怨詩 · n = 321</text>

    <!-- G1m -->
    <text x="320" y="656" font-size="16" fill="#1e293b"><tspan font-weight="700" fill="#b45309">G1m</tspan>  Male ventriloquism</text>
    <text x="320" y="680" font-size="13.5" fill="#64748b">男性代言 · n = 256 · ⊂ G1</text>

    <!-- G2 -->
    <text x="545" y="656" font-size="16" fill="#1e293b"><tspan font-weight="700" fill="#be123c">G2</tspan>  Female poets, all works</text>
    <text x="545" y="680" font-size="13.5" fill="#64748b">女性詩人 · n = 214</text>

    <!-- G3d -->
    <text x="790" y="656" font-size="16" fill="#1e293b"><tspan font-weight="700" fill="#6d28d9">G3d</tspan>  Palace verse, record</text>
    <text x="790" y="680" font-size="13.5" fill="#64748b">宮詞記事 · n = 4 · self-voiced</text>

    <!-- G3l -->
    <text x="1015" y="656" font-size="16" fill="#1e293b"><tspan font-weight="700" fill="#6d28d9">G3l</tspan>  Boudoir lament</text>
    <text x="1015" y="680" font-size="13.5" fill="#64748b">閨怨抒情 · n = 11 · self-voiced</text>
  </g>
</svg>
